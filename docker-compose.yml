version: "3.9"

services:

  # ── PostgreSQL + pgvector ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: starfire_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: starfire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starfire}
      POSTGRES_DB: starfire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starfire -d starfire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: starfire_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API ──────────────────────────────────────────────────────────────────
  starfire:
    build: .
    container_name: starfire_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://starfire:${POSTGRES_PASSWORD:-starfire}@postgres:5432/starfire_db
      SYNC_DATABASE_URL: postgresql://starfire:${POSTGRES_PASSWORD:-starfire}@postgres:5432/starfire_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: starfire_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - starfire

  # ── Migrations (run once) ─────────────────────────────────────────────────
  migrate:
    build: .
    container_name: starfire_migrate
    command: >
      sh -c "alembic upgrade head && echo 'Migrations done'"
    env_file: .env
    environment:
      SYNC_DATABASE_URL: postgresql://starfire:${POSTGRES_PASSWORD:-starfire}@postgres:5432/starfire_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
