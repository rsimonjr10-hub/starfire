name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway redeploy
        run: |
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\") }"}' \
            | tee /tmp/deploy_result.json

          # Fail the action if Railway returned an error
          if grep -q '"errors"' /tmp/deploy_result.json; then
            echo "Railway deploy failed:"
            cat /tmp/deploy_result.json
            exit 1
          fi
          echo "Railway redeploy triggered successfully"

      - name: Wait and verify deployment
        run: |
          echo "Waiting 45s for Railway to build..."
          sleep 45
          for i in {1..10}; do
            STATUS=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"query":"{ deployments(input: { serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\" }, first: 1) { edges { node { status } } } }"}' \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['deployments']['edges'][0]['node']['status'])" 2>/dev/null)
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Deployment SUCCESS"
              exit 0
            elif [ "$STATUS" = "FAILED" ]; then
              echo "Deployment FAILED"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deployment"
          exit 1
